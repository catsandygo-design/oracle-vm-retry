name: Criar VM Oracle quando houver capacidade

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: oracle-vm-create
  cancel-in-progress: false

jobs:
  create-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validar configuração
        env:
          COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          SUBNET_OCID: ${{ vars.OCI_SUBNET_OCID }}
          AVAILABILITY_DOMAIN: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
          IMAGE_OCID: ${{ vars.OCI_UBUNTU_ARM_IMAGE_OCID }}
          SSH_PUBLIC_KEY: ${{ vars.OCI_SSH_PUBLIC_KEY }}
          OCI_CONFIG_CONTENT: ${{ secrets.OCI_CONFIG_CONTENT }}
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          for name in COMPARTMENT_OCID SUBNET_OCID AVAILABILITY_DOMAIN IMAGE_OCID SSH_PUBLIC_KEY OCI_CONFIG_CONTENT OCI_PRIVATE_KEY_PEM; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta configurar ${name} nas configurações do repositório."
              exit 1
            fi
          done

      - name: Preparar OCI CLI
        env:
          OCI_CONFIG_CONTENT: ${{ secrets.OCI_CONFIG_CONTENT }}
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/oci-venv"
          "$RUNNER_TEMP/oci-venv/bin/pip" install --quiet oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_CONFIG_CONTENT" > "$HOME/.oci/config"
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/config" "$HOME/.oci/oci_api_key.pem"
          echo "$RUNNER_TEMP/oci-venv/bin" >> "$GITHUB_PATH"

      - name: Tentar criar VM (1 OCPU, 6 GB)
        env:
          COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          SUBNET_OCID: ${{ vars.OCI_SUBNET_OCID }}
          AVAILABILITY_DOMAIN: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
          IMAGE_OCID: ${{ vars.OCI_UBUNTU_ARM_IMAGE_OCID }}
          SSH_PUBLIC_KEY: ${{ vars.OCI_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          INSTANCE_NAME="oracle-vm-retry"

          # Se uma execução anterior criou a VM, não dispara uma segunda.
          EXISTING_ID="$(oci compute instance list \
            --compartment-id "$COMPARTMENT_OCID" --all \
            --query "data[?\\"display-name\\" == '$INSTANCE_NAME' && \\"lifecycle-state\\" != 'TERMINATED'] | [0].id" \
            --raw-output 2>/dev/null || true)"
          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            echo "A VM já existe: $EXISTING_ID. Não será criada outra."
            exit 0
          fi

          printf '%s\n' "$SSH_PUBLIC_KEY" > "$RUNNER_TEMP/oci_vm_ssh.pub"
          set +e
          oci compute instance launch \
            --availability-domain "$AVAILABILITY_DOMAIN" \
            --compartment-id "$COMPARTMENT_OCID" \
            --display-name "$INSTANCE_NAME" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":1,"memoryInGBs":6}' \
            --subnet-id "$SUBNET_OCID" \
            --image-id "$IMAGE_OCID" \
            --ssh-authorized-keys-file "$RUNNER_TEMP/oci_vm_ssh.pub" \
            --assign-public-ip true \
            --wait-for-state RUNNING \
            --max-wait-seconds 600 \
            2>&1 | tee "$RUNNER_TEMP/oracle-launch.log"
          RESULT=${PIPESTATUS[0]}
          set -e

          if [ "$RESULT" -eq 0 ]; then
            echo "VM criada e em execução."
            exit 0
          fi

          if grep -Eiq 'capacity|out of host|insufficient host' "$RUNNER_TEMP/oracle-launch.log"; then
            echo "A Oracle ainda não tem capacidade. Nova tentativa automática em até 30 minutos."
            exit 0
          fi

          echo "::error::Falha diferente de falta de capacidade. Corrija a configuração; o próximo ciclo agendado também verificará novamente."
          exit "$RESULT"
