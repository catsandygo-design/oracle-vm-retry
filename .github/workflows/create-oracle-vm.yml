name: Criar VM Oracle Always Free quando houver capacidade

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: oracle-vm-create
  cancel-in-progress: false

jobs:
  create-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validar configuração
        env:
          TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          SUBNET_OCID: ${{ vars.OCI_SUBNET_OCID }}
          REGION: ${{ vars.OCI_REGION }}
          IMAGE_OCID: ${{ vars.OCI_UBUNTU_ARM_IMAGE_OCID }}
          SSH_PUBLIC_KEY: ${{ vars.OCI_SSH_PUBLIC_KEY }}
          OCI_CONFIG_CONTENT: ${{ secrets.OCI_CONFIG_CONTENT }}
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          for name in TENANCY_OCID COMPARTMENT_OCID SUBNET_OCID REGION IMAGE_OCID SSH_PUBLIC_KEY OCI_CONFIG_CONTENT OCI_PRIVATE_KEY_PEM; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta configurar ${name} nas configurações do repositório."
              exit 1
            fi
          done
          if ! printf '%s' "$SSH_PUBLIC_KEY" | grep -Eq '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-)'; then
            echo "::error::OCI_SSH_PUBLIC_KEY não parece ser uma chave pública SSH."
            exit 1
          fi

      - name: Preparar OCI CLI
        env:
          OCI_CONFIG_CONTENT: ${{ secrets.OCI_CONFIG_CONTENT }}
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
          REGION: ${{ vars.OCI_REGION }}
          TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/oci-venv"
          "$RUNNER_TEMP/oci-venv/bin/pip" install --quiet oci-cli
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_CONFIG_CONTENT" > "$HOME/.oci/config"
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/config" "$HOME/.oci/oci_api_key.pem"
          CONFIG_REGION="$(awk -F= '/^[[:space:]]*region[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' "$HOME/.oci/config")"
          CONFIG_TENANCY="$(awk -F= '/^[[:space:]]*tenancy[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' "$HOME/.oci/config")"
          if [ "$CONFIG_REGION" != "$REGION" ] || [ "$CONFIG_TENANCY" != "$TENANCY_OCID" ]; then
            echo "::error::A região ou tenancy do OCI_CONFIG_CONTENT não corresponde às variáveis OCI_REGION e OCI_TENANCY_OCID."
            exit 1
          fi
          echo "$RUNNER_TEMP/oci-venv/bin" >> "$GITHUB_PATH"

      - name: Confirmar que a região é a região home
        env:
          TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          REGION: ${{ vars.OCI_REGION }}
        run: |
          set -euo pipefail
          oci iam region-subscription list --tenancy-id "$TENANCY_OCID" --all --output json > "$RUNNER_TEMP/regions.json"
          HOME_REGION="$(python3 - "$RUNNER_TEMP/regions.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8")).get("data", [])
          homes = [x.get("region-name") for x in data if x.get("is-home-region")]
          print(homes[0] if len(homes) == 1 else "")
          PY
          )"
          if [ -z "$HOME_REGION" ] || [ "$REGION" != "$HOME_REGION" ]; then
            echo "::error::Criação bloqueada: OCI_REGION deve ser a região home da tenancy (região identificada: ${HOME_REGION:-não identificada})."
            exit 1
          fi
          echo "Região home confirmada."

      - name: Verificar limites Always Free antes de criar
        id: preflight
        env:
          TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
        run: |
          set -euo pipefail
          # Lista os compartimentos e consulta cada um individualmente. Se uma consulta falhar, para sem criar.
          oci iam compartment list --compartment-id "$TENANCY_OCID" --compartment-id-in-subtree true --all --output json > "$RUNNER_TEMP/compartments.json"
          oci iam availability-domain list --compartment-id "$TENANCY_OCID" --output json > "$RUNNER_TEMP/ads.json"

          python3 - "$RUNNER_TEMP/compartments.json" "$RUNNER_TEMP/ads.json" "$RUNNER_TEMP" <<'PY'
          import json, os, pathlib, sys
          compartments_path, ads_path, temp = map(pathlib.Path, sys.argv[1:])
          compartments = json.loads(compartments_path.read_text()).get("data", [])
          ids = {i.get("id") for i in compartments if i.get("id") and i.get("lifecycle-state") == "ACTIVE"}
          ids.add(os.environ["TENANCY_OCID"])
          ads = [x.get("name") for x in json.loads(ads_path.read_text()).get("data", []) if x.get("name")]
          (temp / "compartment-ids.txt").write_text("\n".join(sorted(ids)))
          (temp / "availability-domains.txt").write_text("\n".join(ads))
          if not ads:
              print("::error::Não foi possível identificar os domínios de disponibilidade.")
              raise SystemExit(1)
          PY

          mkdir -p "$RUNNER_TEMP/instance-lists"
          compartment_index=0
          while IFS= read -r compartment; do
            [ -n "$compartment" ] || continue
            oci compute instance list --compartment-id "$compartment" --all --output json > "$RUNNER_TEMP/instance-lists/instances-$compartment_index.json"
            compartment_index=$((compartment_index + 1))
          done < "$RUNNER_TEMP/compartment-ids.txt"

          python3 - "$RUNNER_TEMP/instance-lists" "$RUNNER_TEMP" <<'PY'
          import glob, json, os, pathlib, sys
          temp = pathlib.Path(sys.argv[2])
          instances = []
          for filename in glob.glob(str(pathlib.Path(sys.argv[1]) / "*.json")):
              instances.extend(json.loads(pathlib.Path(filename).read_text()).get("data", []))
          active = [i for i in instances if i.get("lifecycle-state") != "TERMINATED"]
          existing = [i for i in active if i.get("display-name") == "oracle-vm-retry"]
          if existing:
              print(f"::notice::A VM oracle-vm-retry já existe ({existing[0].get('id')}); nenhuma nova VM será criada.")
              (temp / "already-exists").write_text("yes")
              raise SystemExit(0)
          a1 = [i for i in active if i.get("shape") == "VM.Standard.A1.Flex"]
          ocpus = sum(float((i.get("shape-config") or {}).get("ocpus", 0)) for i in a1)
          memory = sum(float((i.get("shape-config") or {}).get("memory-in-gbs", 0)) for i in a1)
          if ocpus + 1 > 2 or memory + 6 > 12:
              print(f"::error::Criação bloqueada pelo teto Always Free: A1 existente {ocpus:g} OCPU/{memory:g} GB; nova VM exige 1 OCPU/6 GB; limite Always Free é 2 OCPU/12 GB.")
              raise SystemExit(1)
          print(f"Pré-checagem de compute aprovada: A1 existente {ocpus:g} OCPU/{memory:g} GB.")
          PY

          if [ -f "$RUNNER_TEMP/already-exists" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/volume-lists"
          volume_index=0
          while IFS= read -r compartment; do
            [ -n "$compartment" ] || continue
            while IFS= read -r ad; do
              [ -n "$ad" ] || continue
              oci bv boot-volume list --compartment-id "$compartment" --availability-domain "$ad" --all --output json > "$RUNNER_TEMP/volume-lists/boot-$volume_index.json"
              oci bv volume list --compartment-id "$compartment" --availability-domain "$ad" --all --output json > "$RUNNER_TEMP/volume-lists/block-$volume_index.json"
              volume_index=$((volume_index + 1))
            done < "$RUNNER_TEMP/availability-domains.txt"
          done < "$RUNNER_TEMP/compartment-ids.txt"

          python3 - "$RUNNER_TEMP/volume-lists" <<'PY'
          import glob, json, pathlib, sys
          total = 0
          for filename in glob.glob(str(pathlib.Path(sys.argv[1]) / "*.json")):
              data = json.loads(pathlib.Path(filename).read_text()).get("data", [])
              for volume in data:
                  if volume.get("lifecycle-state") not in ("TERMINATED", "TERMINATING", "DELETING"):
                      total += float(volume.get("size-in-gbs", 0))
          if total + 48 > 200:
              print(f"::error::Criação bloqueada: volumes existentes somam {total:g} GB; a VM precisa de 48 GB e o limite combinado Always Free é 200 GB.")
              raise SystemExit(1)
          print(f"Pré-checagem de volumes aprovada: {total:g} GB existentes; serão usados 48 GB.")
          PY
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Tentar criar VM A1 elegível ao Always Free (1 OCPU, 6 GB, volume 48 GB)
        if: steps.preflight.outputs.skip != 'true'
        env:
          COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          SUBNET_OCID: ${{ vars.OCI_SUBNET_OCID }}
          IMAGE_OCID: ${{ vars.OCI_UBUNTU_ARM_IMAGE_OCID }}
          SSH_PUBLIC_KEY: ${{ vars.OCI_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$RUNNER_TEMP/oci_vm_ssh.pub"
          found_capacity=false
          while IFS= read -r AD; do
            [ -n "$AD" ] || continue
            echo "Tentando o domínio $AD (shape A1, 1 OCPU, 6 GB, sem IPv4 público)..."
            set +e
            oci compute instance launch \
              --availability-domain "$AD" \
              --compartment-id "$COMPARTMENT_OCID" \
              --display-name "oracle-vm-retry" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":1,"memoryInGBs":6}' \
              --subnet-id "$SUBNET_OCID" \
              --image-id "$IMAGE_OCID" \
              --ssh-authorized-keys-file "$RUNNER_TEMP/oci_vm_ssh.pub" \
              --assign-public-ip false \
              --boot-volume-size-in-gbs 48 \
              --wait-for-state RUNNING \
              --max-wait-seconds 600 \
              2>&1 | tee "$RUNNER_TEMP/oracle-launch.log"
            RESULT=${PIPESTATUS[0]}
            set -e
            if [ "$RESULT" -eq 0 ]; then
              echo "VM criada e em execução em $AD."
              exit 0
            fi
            if grep -Eiq 'capacity|out of host|insufficient host' "$RUNNER_TEMP/oracle-launch.log"; then
              found_capacity=true
              echo "Sem capacidade em $AD; tentando o próximo domínio."
              continue
            fi
            echo "::error::A Oracle recusou a criação por um motivo diferente de capacidade. Nenhum recurso alternativo será tentado."
            exit "$RESULT"
          done < "$RUNNER_TEMP/availability-domains.txt"

          if [ "$found_capacity" = true ]; then
            echo "Nenhum domínio tinha capacidade. Nova tentativa automática em até 30 minutos."
            exit 0
          fi
          echo "::error::Nenhum domínio de disponibilidade disponível para a região home."
          exit 1
